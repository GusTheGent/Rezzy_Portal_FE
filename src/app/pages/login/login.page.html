<ion-content [fullscreen]="true">
  <div class="login-container">

    <ion-img src="assets/images/app_login_logo.png" class="app-logo-login" />

    <form [formGroup]="loginForm" class="login-form">
      <ion-card class="ion-no-margin ion-padding">
        <ion-card-header class="ion-text-center">
          <ion-card-title>Login</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ion-item lines="stacked">
            <ion-input
              type="text"
              label="Username"
              labelPlacement="floating"
              placeholder="Enter your username"
              formControlName="username"
            />
          </ion-item>
          <ion-item lines="stacked" class="ion-margin-bottom">
            <ion-input
              type="password"
              label="Password"
              labelPlacement="floating"
              placeholder="Enter your password"
              formControlName="password"
            />
          </ion-item>

          <ion-button expand="block" fill="solid" color="primary" type="submit">
            Submit
            <ion-icon name="log-in-outline" slot="end"></ion-icon>
          </ion-button>
        </ion-card-content>
      </ion-card>
    </form>

  </div>
</ion-content>
