<ion-menu contentId="main-content" side="end" menuId="main-menu">
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list>
      @for (routeItem of routeItems; track routeItem.title) {
        <ion-menu-toggle>
          <ion-item
            routerDirection="root"
            [routerLink]="[routeItem.url]"
            lines="none"
            detail="false"
            routerLinkActive="selected"
            [disabled]="routeItem.disabled"
          >
            <ion-icon
              aria-hidden="true"
              slot="start"
              [ios]="routeItem.icon + '-outline'"
              [md]="routeItem.icon + '-sharp'"
            ></ion-icon>
            <ion-label>{{ routeItem.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      }
    </ion-list>
  </ion-content>
</ion-menu>
